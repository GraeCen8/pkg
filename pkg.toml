# Example pkg.toml with pkgs_map for cross-platform package mapping

[pkgs_map]
ripgrep = { apt = "ripgrep", pacman = "ripgrep", brew = "rg" }
bat = { apt = "bat", pacman = "bat", brew = "bat" }

[config]
mode = "pkg"
# stow = []

[[system]]
packages = ["bat", "lua-language-server", "ripgrep"]
# modules = []
